<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, attrs={}, kids=[]) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) { if (kid == null) continue; n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid); }
  return n;
};
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct = (x) => (x == null || Number.isNaN(x)) ? 'n/a' : (x*100).toFixed(1).replace(/\.0$/,'') + '%';
const num3 = (x) => (x == null || Number.isNaN(x)) ? 'n/a' : x.toFixed(3);
const METHOD = (m) => el('span', {class:'m m-'+m, text:m});
const CAT = (c) => el('span', {class:'cat', text:c});

const APPROACH_COLOR = { 'Role-aware':'var(--series-1)', 'Status-only':'var(--series-2)', 'OWASP ZAP':'var(--series-3)' };
const SCOPE_LABEL = { OVERALL:'All categories', BOLA:'BOLA (object level)', BFLA:'BFLA (function level)', AUTH_MISSING:'Missing auth', AUTH_INVALID_TOKEN:'Invalid token', JWT_SIGNATURE:'JWT signature', JWT_NONE_ALG:'JWT alg:none', JWT_EXPIRED:'JWT expired' };

/* ---------- tooltip ---------- */
const tip = $('#tooltip');
function showTip(html, x, y){ tip.innerHTML = html; tip.style.opacity = '1'; moveTip(x,y); }
function moveTip(x,y){ const w = tip.offsetWidth, h = tip.offsetHeight; let nx = x+14, ny = y+14; if (nx+w>innerWidth-8) nx = x-w-14; if (ny+h>innerHeight-8) ny = y-h-14; tip.style.left = nx+'px'; tip.style.top = ny+'px'; }
function hideTip(){ tip.style.opacity = '0'; }

function renderOverview(root){
  const o = DATA.overview;
  root.innerHTML = '';
  const S = el('div', {class:'stack'});

  S.appendChild(el('p', {class:'lead', html:
    'Most API security bugs are not exotic. The commonest is simply this: the server checks <em>that you are logged in</em>, but forgets to check <em>whether this particular thing is yours to touch</em>. This tool logs in as several different users and tries, on purpose, to reach each other’s data — then judges what came back the way a careful human would.'}));

  // What is BAC
  S.appendChild(el('h2', {text:'What is "broken access control"?'}));
  const defs = el('div', {class:'grid2'});
  defs.appendChild(el('div', {class:'card', html:
    '<h3>BOLA — object-level <span class="muted" style="font-weight:400">(is this record mine?)</span></h3>'+
    '<p class="sub">Broken Object Level Authorization. You are allowed to read orders — but the server lets you read <em>anyone’s</em> order by changing the id in the URL. '+
    'Example: Alice opens <code>GET /api/orders/1005</code>, an order that belongs to Bob, and the server hands it over.</p>'+
    '<div class="muted">OWASP API Security · API1:2023 · '+ (o.flawFamilies.BOLA||0) +' flaws in this benchmark</div>'}));
  defs.appendChild(el('div', {class:'card', html:
    '<h3>BFLA — function-level <span class="muted" style="font-weight:400">(am I allowed this action?)</span></h3>'+
    '<p class="sub">Broken Function Level Authorization. An action meant for admins is reachable by ordinary users. '+
    'Example: a normal user calls <code>GET /api/admin/users</code> and receives the full account list, or publishes an announcement.</p>'+
    '<div class="muted">OWASP API Security · API5:2023 · '+ (o.flawFamilies.BFLA||0) +' flaws in this benchmark</div>'}));
  S.appendChild(defs);

  // Three approaches
  S.appendChild(el('h2', {text:'Three ways to decide — compared'}));
  S.appendChild(el('p', {class:'sub', html:'All numbers below are the measured results on the benchmark’s vulnerable build ('+o.totals.scored+' scored cases, '+o.totals.vulnerable+' of them genuinely vulnerable). The research question RQ2 is exactly this comparison.'}));
  const appr = el('div', {class:'grid3'});
  const blurbs = {
    'Role-aware': 'The thesis tool. Reads the response <em>body</em>, compares it with the real owner’s, and checks who actually owns what. The <b>ownership-differential oracle</b>.',
    'Status-only': 'A deliberately simple baseline. Sends the <em>same</em> requests, but trusts the HTTP status code alone: any 2xx to a forbidden request is called a vulnerability.',
    'OWASP ZAP': 'An industry-standard scanner in its standard API scan — a single-user tool, not designed to reason about cross-user ownership.'
  };
  for (const h of o.headline){
    const bad = h.fp > 0;
    appr.appendChild(el('div', {class:'card'}, [
      el('h3', {html:'<span class="swatch" style="background:'+APPROACH_COLOR[h.approach]+'"></span>'+esc(h.approach)}),
      el('p', {class:'sub', style:'min-height:72px', html: blurbs[h.approach]||''}),
      el('div', {class:'kv', html:
        '<dt>Precision</dt><dd>'+num3(h.precision)+'</dd>'+
        '<dt>Recall</dt><dd>'+num3(h.recall)+'</dd>'+
        '<dt>F1 score</dt><dd>'+num3(h.f1)+'</dd>'+
        '<dt>False-positive rate</dt><dd>'+pct(h.fpr)+'</dd>'+
        '<dt>Found</dt><dd>'+h.detected+' / '+o.totals.vulnerable+' real flaws</dd>'}),
      el('div', {style:'margin-top:10px', html: bad
        ? '<span class="pill" style="color:var(--series-2);border-color:var(--series-2)">'+h.fp+' false alarms</span>'
        : (h.detected===0 ? '<span class="pill">no detections</span>' : '<span class="pill" style="color:var(--good-text);border-color:var(--good)">no false alarms</span>') })
    ]));
  }
  S.appendChild(appr);
  S.appendChild(el('div', {class:'note', html:'<strong>The headline:</strong> the role-aware oracle and the status-only baseline send the <em>exact same</em> '+o.requests+' requests. The only thing that differs is how they <em>read the answer</em> — and that single choice is the difference between perfect precision and 18 false alarms. The <a href="#" data-goto="how">How it works</a> view shows this on one response at a time.'}));

  // Benchmark
  S.appendChild(el('h2', {text:'The benchmark'}));
  const t = el('div', {class:'tiles'});
  const tile = (k,v,d)=> el('div',{class:'tile',html:'<div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+(d||'')+'</div>'});
  t.appendChild(tile('Injected flaws', DATA.flaws.length, (o.flawFamilies.BOLA||0)+' BOLA, '+(o.flawFamilies.BFLA||0)+' BFLA, '+(DATA.flaws.length-(o.flawFamilies.BOLA||0)-(o.flawFamilies.BFLA||0))+' auth/JWT'));
  t.appendChild(tile('Scored cases', o.totals.scored, 'method × path × category'));
  t.appendChild(tile('Genuinely vulnerable', o.totals.vulnerable, 'the rest are true negatives'));
  t.appendChild(tile('Requests per run', o.requests, '~'+(o.durationMean/1000).toFixed(1)+' s end to end'));
  S.appendChild(t);
  S.appendChild(el('p', {class:'sub', html:'The benchmark is built so that a status-code check and an ownership-aware check <em>must</em> disagree: it contains legitimate 2xx responses — public documents, soft denials, role-filtered views, an endpoint that ignores the path id — that look like leaks but are not. Those are the true-negative traps you can explore in the <a href="#" data-goto="results">Results</a> grid.'}));

  root.appendChild(S);
}

const HOW = { ex: 0, step: 0 };
const STEPS = ['Load the spec','Log in','Craft the attack','Send it','Two oracles judge','The verdict'];

function renderHow(root){
  root.innerHTML = '';
  const S = el('div', {class:'stack'});
  S.appendChild(el('h2', {text:'Follow one request through the tool'}));
  S.appendChild(el('p', {class:'sub', html:'Pick a scenario, then step through what the scanner does with it. Step 5 is the heart of the thesis: the two decision rules look at the <em>same</em> response and often disagree.'}));

  // example picker
  const chips = el('div', {class:'chip-row'});
  DATA.walkthrough.forEach((w,i)=>{
    chips.appendChild(el('button', {class:'chip', 'aria-pressed': String(i===HOW.ex), onclick:()=>{ HOW.ex=i; HOW.step=0; renderHow(root); }}, [
      el('span', {}, w.title)
    ]));
  });
  S.appendChild(chips);

  const w = DATA.walkthrough[HOW.ex];
  S.appendChild(el('div', {class:'note '+(w.groundTruth.vulnerable?'warn':'good'), html:
    '<strong>'+esc(w.title)+'.</strong> '+esc(w.tagline)}));

  // stepper
  const sp = el('div', {class:'stepper', role:'progressbar', 'aria-valuenow':String(HOW.step+1), 'aria-valuemax':String(STEPS.length)});
  STEPS.forEach((_,i)=> sp.appendChild(el('div',{class:'dot '+(i<HOW.step?'done':i===HOW.step?'cur':''), title:STEPS[i]})));
  S.appendChild(sp);

  const card = el('div', {class:'card', id:'step-card', style:'min-height:300px'});
  card.appendChild(renderStep(w, HOW.step));
  S.appendChild(card);

  // nav
  const nav = el('div', {style:'display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'});
  nav.appendChild(el('div', {class:'muted', text:'Step '+(HOW.step+1)+' of '+STEPS.length+' — '+STEPS[HOW.step]}));
  const btns = el('div', {class:'nav-btns'});
  btns.appendChild(el('button', {class:'btn', disabled: HOW.step===0?'':null, onclick:()=>{ if(HOW.step>0){HOW.step--; renderHow(root);} }}, '← Previous'));
  if (HOW.step < STEPS.length-1)
    btns.appendChild(el('button', {class:'btn primary', onclick:()=>{ HOW.step++; renderHow(root); }}, 'Next →'));
  else
    btns.appendChild(el('button', {class:'btn primary', onclick:()=>{ HOW.ex=(HOW.ex+1)%DATA.walkthrough.length; HOW.step=0; renderHow(root); }}, 'Next scenario ↺'));
  nav.appendChild(btns);
  S.appendChild(nav);

  root.appendChild(S);
  $('#step-card').scrollIntoView({block:'nearest'});
}

function reqPre(req){
  const h = Object.entries(req.headers||{}).map(([k,v])=>'<span class="k">'+esc(k)+':</span> '+esc(v)).join('\n');
  const u = new URL(req.url);
  return '<span class="mline">'+esc(req.method)+'</span> '+esc(u.pathname)+'\n<span class="k">Host:</span> '+esc(u.host)+'\n'+h + (req.body? '\n\n'+esc(JSON.stringify(req.body,null,2)) : '');
}
function resPre(res){
  const cls = res.status>=200&&res.status<300 ? 'status-2' : '';
  return 'HTTP <span class="'+cls+'">'+res.status+'</span>\n\n'+esc(JSON.stringify(res.body, null, 2));
}

function renderStep(w, step){
  const wrap = el('div', {class:'stack'});
  const attacker = w.attacker || {account:'alice',role:'user'};
  const victim = w.victim;
  const head = (n,t)=> el('div',{class:'step-head'},[el('span',{class:'num',text:'STEP '+(n+1)}), el('h3',{text:t})]);

  if (step===0){ // load spec
    wrap.appendChild(head(0,'Read the OpenAPI spec and its intended policy'));
    wrap.appendChild(el('p',{class:'sub',html:'The scanner starts from the API’s own OpenAPI document. For this operation the spec declares, in an <code>x-access-control</code> annotation, <em>who</em> is allowed and <em>whose</em> data it is:'}));
    wrap.appendChild(el('div',{class:'flagwrap'},[METHOD(w.method), el('code',{text:w.path}), CAT(w.category)]));
    const p = w.policy;
    if (p){
      wrap.appendChild(el('pre',{html:
        'x-access-control:\n  <span class="k">roles:</span>     ['+esc(p.roles.join(', '))+']'+
        (p.ownership? '\n  <span class="k">ownership:</span> '+esc(p.ownership):'' )+
        (p.ownerField? '\n  <span class="k">ownerField:</span> '+esc(p.ownerField):'')+
        (p.resource? '\n  <span class="k">resource:</span>  '+esc(p.resource):'')}));
      wrap.appendChild(el('p',{class:'sub',html: p.ownership==='owner'
        ? 'In plain words: these roles may use this endpoint, <strong>but only against objects they own</strong> (ownership is read from the <code>'+esc(p.ownerField)+'</code> field). That "only their own" clause is what the tool is about to test.'
        : 'In plain words: access here is decided by <strong>role</strong>, not ownership — so the tool will check that a disallowed role is actually turned away.'}));
    }
    wrap.appendChild(el('div',{class:'muted',html:'Source: <code>test-api/openapi.yaml</code>'}));
  }

  else if (step===1){ // log in
    wrap.appendChild(head(1,'Log in as every configured account'));
    wrap.appendChild(el('p',{class:'sub',html:'The tool authenticates once as each account in its config and keeps the tokens. Having several identities — with different roles and different owned objects — is what makes cross-user testing possible at all.'}));
    const row = el('div',{class:'accounts-row'});
    DATA.accounts.forEach(a=>{
      const isAtt = a.name===attacker.account;
      const isVic = victim && a.name===victim.account;
      row.appendChild(el('div',{class:'acct'+(isAtt?' attacker':'')},[
        el('div',{class:'nm'},[a.name, el('span',{class:'pill role',text:a.role}), isAtt?el('span',{class:'pill',style:'color:var(--series-2);border-color:var(--series-2)',text:'attacker'}):null, isVic?el('span',{class:'pill',style:'color:var(--accent);border-color:var(--accent)',text:'owner'}):null]),
        el('div',{class:'muted',style:'margin-top:4px',text:a.can})
      ]));
    });
    wrap.appendChild(row);
    wrap.appendChild(el('div',{class:'muted',html:'Source: <code>cli-tool/config/example.config.yaml</code> · credentials are synthetic, benchmark-only, and redacted in every saved result.'}));
  }

  else if (step===2){ // craft
    wrap.appendChild(head(2,'Craft the cross-boundary request'));
    const who = w.category==='BFLA'
      ? '<strong>'+esc(attacker.account)+'</strong> has the role <span class="pill role">'+esc(attacker.role)+'</span>, which the policy does <em>not</em> allow here. The tool sends the request anyway, to see whether the function is really protected.'
      : '<strong>'+esc(attacker.account)+'</strong> is allowed to use this endpoint, but only for '+esc(attacker.account)+'’s own objects. The tool deliberately points the request at an object owned by <strong>'+esc(victim?victim.account:'another user')+'</strong>.';
    wrap.appendChild(el('p',{class:'sub',html:who}));
    wrap.appendChild(el('p',{class:'sub',html:'Every detection strategy is handed this <em>identical</em> generated request — only the later judgement differs. That is what lets the thesis attribute the difference in results to the decision rule alone.'}));
    wrap.appendChild(el('pre',{html: reqPre(w.request)}));
    if (victim) wrap.appendChild(el('div',{class:'muted',html:'Attacker: <strong>'+esc(attacker.account)+'</strong> ('+esc(attacker.role)+') · target object owned by: <strong>'+esc(victim.account)+'</strong> ('+esc(victim.role)+')'}));
  }

  else if (step===3){ // send
    wrap.appendChild(head(3,'Send it and capture the real response'));
    wrap.appendChild(el('p',{class:'sub',html:'Here is the actual request the tool sent and the response the benchmark returned — copied straight from the archived evidence.'}));
    wrap.appendChild(el('div',{class:'exchange'},[
      el('div',{},[el('h4',{text:'Request'}), el('pre',{html:reqPre(w.request)})]),
      el('div',{},[el('h4',{text:'Response'}), el('pre',{html:resPre(w.response)})])
    ]));
    wrap.appendChild(el('div',{class:'note',html:'Notice the status line: <strong>HTTP '+w.response.status+'</strong>. A '+(w.response.status>=200&&w.response.status<300?'2xx':'non-2xx')+' code. Keep it in mind — the next step is where the two oracles part ways over exactly this answer.'}));
  }

  else if (step===4){ // oracles
    wrap.appendChild(head(4,'The same response, two different decisions'));
    wrap.appendChild(el('p',{class:'sub',html:'Both oracles now look at the response above. The status-only baseline looks only at the number on the status line. The role-aware oracle looks <em>inside</em> — at ownership and content.'}));
    const grid = el('div',{class:'how-oracles'});
    const mk = (title, color, dec, correct, reason)=> {
      const flagging = dec==='flag';
      return el('div',{class:'oracle-card '+(correct?'correct':'wrong')},[
        el('div',{class:'hd'},[
          el('div',{html:'<span class="swatch" style="background:'+color+'"></span><strong>'+title+'</strong>'}),
          el('span',{class:'pill', style:correct?'color:var(--good-text);border-color:var(--good)':'color:var(--critical-text);border-color:var(--critical)', text: correct?'correct':'wrong'})
        ]),
        el('div',{class:'verdict '+(flagging?'flag':'allow'),style:'margin-bottom:8px'},[
          el('span',{class:'ico',text: flagging?'!':'✓'}),
          flagging?'Reports a vulnerability':'Allows it (no finding)'
        ]),
        el('p',{class:'sub',style:'margin:0',text: reason})
      ]);
    };
    grid.appendChild(mk('Status-only', 'var(--series-2)', w.statusOnly.decision, w.statusOnly.correct, w.statusOnly.reason));
    grid.appendChild(mk('Role-aware (ownership-differential)', 'var(--series-1)', w.roleAware.decision, w.roleAware.correct, w.roleAware.reason));
    wrap.appendChild(grid);
    const same = w.statusOnly.decision===w.roleAware.decision;
    wrap.appendChild(el('div',{class:'note '+(same?'good':'warn'),html: same
      ? 'Here both oracles agree — and both are right. On a clear-cut case the simple rule is enough.'
      : 'Here they disagree. The response is HTTP '+w.response.status+', so the status-only rule cries foul — but '+(w.groundTruth.vulnerable?'':'nothing was actually leaked, so ')+'the ownership-aware rule '+(w.roleAware.decision==='allow'?'correctly lets it pass':'correctly flags it')+'. This single disagreement, repeated across the benchmark, is the whole of RQ2.'}));
  }

  else if (step===5){ // verdict
    wrap.appendChild(head(5,'The verdict, and whether it was right'));
    const gtVuln = w.groundTruth.vulnerable;
    wrap.appendChild(el('div',{class:'grid2'},[
      el('div',{class:'card flat'},[
        el('h4',{text:'Ground truth'}),
        el('div',{class:'verdict '+(gtVuln?'flag':'allow'),style:'margin:4px 0 8px'},[el('span',{class:'ico',text:gtVuln?'!':'✓'}), gtVuln?'Genuinely vulnerable':'Safe by design (true negative)']),
        el('p',{class:'sub',style:'margin:0',text: w.groundTruth.notes || (gtVuln?'A real, injected access-control flaw.':'Legitimate behaviour.')})
      ]),
      el('div',{class:'card flat'},[
        el('h4',{text:'Scorecard for this case'}),
        el('table',{html:
          '<tbody>'+
          '<tr><td><span class="swatch" style="background:var(--series-2)"></span>Status-only</td><td>'+verdictCell(w.statusOnly)+'</td></tr>'+
          '<tr><td><span class="swatch" style="background:var(--series-1)"></span>Role-aware</td><td>'+verdictCell(w.roleAware)+'</td></tr>'+
          '</tbody>'})
      ])
    ]));
    if (gtVuln){
      const f = DATA.findings.find(x=>x.method===w.method && x.path===w.path);
      if (f) wrap.appendChild(el('div',{class:'card flat'},[
        el('h4',{text:'The finding the role-aware tool wrote'}),
        el('div',{class:'kv',html:
          '<dt>id</dt><dd class="mono">'+esc(f.id)+'</dd>'+
          '<dt>category</dt><dd>'+esc(f.category)+'</dd>'+
          '<dt>severity</dt><dd><span class="sev-badge '+f.severity+'">'+esc(f.severity)+'</span></dd>'+
          '<dt>status</dt><dd>'+esc(f.status)+' ('+Math.round((f.confidence||0)*100)+'% confidence)</dd>'+
          '<dt>observed</dt><dd>'+esc(f.observed)+'</dd>'})
      ]));
    } else {
      wrap.appendChild(el('div',{class:'note good',html:'The role-aware tool wrote <strong>no finding</strong> here — correctly. The status-only baseline raised a false alarm. Multiply that across the benchmark’s true-negative traps and you get its 18 false positives.'}));
    }
  }
  return wrap;
}
function verdictCell(v){
  const ok = v.correct;
  const label = v.decision==='flag'?'flagged':'allowed';
  return '<span class="verdict '+(v.decision==='flag'?'flag':'allow')+'" style="font-size:12.5px"><span class="ico" style="width:16px;height:16px;font-size:11px">'+(v.decision==='flag'?'!':'✓')+'</span>'+label+'</span> '+
    '<span class="pill" style="margin-left:6px;'+(ok?'color:var(--good-text);border-color:var(--good)':'color:var(--critical-text);border-color:var(--critical)')+'">'+(ok?'correct':'false alarm')+'</span>';
}

  t.appendChild(tile('Requests', rq3.requests, 'sent per full scan'));

function chartMetrics(runs, scope){
  // grouped bars: 4 metric groups x 3 approaches
  const metrics = [
    {key:'precision', label:'Precision', better:'high'},
    {key:'recall',    label:'Recall',    better:'high'},
    {key:'f1',        label:'F1',         better:'high'},
    {key:'fpr',       label:'False-pos. rate', better:'low'},
  ];
  const W = 720, H = 300, padL = 36, padR = 12, padT = 14, padB = 56;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const groups = metrics.length;
  const gw = plotW/groups;
  const barW = Math.min(30, (gw-24)/runs.length);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('class','chart'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Grouped bar chart of precision, recall, F1 and false-positive rate for the three approaches, scope '+(SCOPE_LABEL[scope]||scope));
  const add=(tag,at)=>{const e=document.createElementNS(ns,tag); for(const k in at) e.setAttribute(k,at[k]); svg.appendChild(e); return e;};
  // gridlines + y axis 0..1
  for (let i=0;i<=5;i++){ const y=padT+plotH*(1-i/5); add('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'var(--grid)','stroke-width':1}); const tx=add('text',{x:padL-6,y:y+3,'text-anchor':'end','font-size':10}); tx.textContent=(i/5).toFixed(1); }
  metrics.forEach((m,gi)=>{
    const gx = padL + gi*gw;
    // group label
    const gl=add('text',{x:gx+gw/2,y:H-padB+16,'text-anchor':'middle','font-size':11.5}); gl.textContent=m.label;
    const bl=add('text',{x:gx+gw/2,y:H-padB+30,'text-anchor':'middle','font-size':9.5,fill:'var(--text-muted)'}); bl.textContent=m.better==='low'?'(lower better)':'(higher better)';
    const totW = runs.length*barW + (runs.length-1)*6;
    let bx = gx + (gw-totW)/2;
    runs.forEach(r=>{
      const sc = r.scopes[scope];
      let v = sc ? sc[m.key] : null;
      const color = APPROACH_COLOR[r.name];
      if (v==null || Number.isNaN(v)){
        // n/a marker
        const ty=add('text',{x:bx+barW/2,y:padT+plotH-4,'text-anchor':'middle','font-size':10,fill:'var(--text-muted)'}); ty.textContent='n/a';
      } else {
        const h = Math.max(v*plotH, v>0?2:0);
        const y = padT+plotH-h;
        const rect=add('rect',{x:bx,y:y,width:barW,height:h,rx:3,fill:color});
        rect.style.cursor='pointer';
        const lbl = m.key==='fpr'? pct(v) : num3(v);
        rect.addEventListener('mousemove',(e)=>showTip('<strong>'+r.name+'</strong><br>'+m.label+' ('+(SCOPE_LABEL[scope]||scope)+'): <strong>'+lbl+'</strong>'+(sc?'<br>TP '+sc.tp+' · FP '+sc.fp+' · FN '+sc.fn+' · TN '+sc.tn:''), e.clientX,e.clientY));
        rect.addEventListener('mouseleave',hideTip);
        // direct value label (satisfies contrast relief + no color-only reading)
        const t=add('text',{x:bx+barW/2,y:y-4,'text-anchor':'middle','class':'bar-label'}); t.textContent = (v===0?'0':(m.key==='fpr'?(v*100).toFixed(0)+'%':v.toFixed(2)));
      }
      bx += barW+6;
    });
  });
  const wrap = el('div',{class:'chart-wrap'});
  wrap.appendChild(svg);
  // legend
  const lg = el('div',{class:'legend'});
  runs.forEach(r=> lg.appendChild(el('span',{class:'it',html:'<span class="swatch" style="background:'+APPROACH_COLOR[r.name]+'"></span>'+esc(r.name)})));
  wrap.appendChild(lg);
  return wrap;
}

function metricTable(runs, scope){
  const rows = runs.map(r=>{ const s=r.scopes[scope]; return '<tr><td><span class="swatch" style="background:'+APPROACH_COLOR[r.name]+'"></span>'+esc(r.name)+'</td>'+
    '<td class="num">'+ (s?num3(s.precision):'n/a') +'</td><td class="num">'+ (s?num3(s.recall):'n/a') +'</td><td class="num">'+ (s?num3(s.f1):'n/a') +'</td><td class="num">'+ (s?pct(s.fpr):'n/a') +'</td>'+
    '<td class="num">'+(s?s.tp:'–')+'</td><td class="num">'+(s?s.fp:'–')+'</td><td class="num">'+(s?s.fn:'–')+'</td><td class="num">'+(s?s.tn:'–')+'</td></tr>'; }).join('');
  return el('table',{html:'<thead><tr><th>Approach</th><th class="num">Prec.</th><th class="num">Recall</th><th class="num">F1</th><th class="num">FPR</th><th class="num">TP</th><th class="num">FP</th><th class="num">FN</th><th class="num">TN</th></tr></thead><tbody>'+rows+'</tbody>'});
}

function detectionGrid(b){
  const wrap = el('div',{class:'card'});
  // filters
  const cats = ['all', ...DATA.overview.categories];
  const seg = el('div',{class:'seg'});
  const filters = [['all','All'],['vuln','Vulnerable only'],['tn','True negatives only']];
  filters.forEach(([k,l])=> seg.appendChild(el('button',{'aria-pressed':String(RES.gridFilter===k), onclick:()=>{RES.gridFilter=k; renderResults(document.getElementById('view-results'));}}, l)));
  wrap.appendChild(el('div',{class:'controls',style:'margin-bottom:12px'},[el('span',{class:'muted',text:'Show:'}), seg]));

  let cases = b.cases;
  if (RES.gridFilter==='vuln') cases = cases.filter(c=>c.vulnerable);
  else if (RES.gridFilter==='tn') cases = cases.filter(c=>!c.vulnerable);

  const map = el('div',{class:'gridmap'});
  ['Role-aware','Status-only','OWASP ZAP'].forEach(appr=>{
    const cells = el('div',{class:'gcells'});
    let fp=0,miss=0,hit=0;
    cases.forEach(c=>{
      const reported = c.results[appr];
      let cls, label;
      if (c.vulnerable){ if (reported){cls='vuln-hit';label='detected';hit++;} else {cls='vuln-miss';label='MISSED';miss++;} }
      else { if (reported){cls='tn-fp';label='FALSE ALARM';fp++;} else {cls='tn-ok';label='correctly allowed';} }
      const cell = el('div',{class:'gcell '+cls, tabindex:'0', role:'img', 'aria-label':c.method+' '+c.path+' ('+c.category+'): '+label});
      const tipHtml = '<strong>'+c.method+' '+esc(c.path)+'</strong><br>'+c.category+' · '+(c.vulnerable?'vulnerable':'true negative')+'<br>'+appr+': <strong>'+label+'</strong>'+(c.notes?'<br><span style="opacity:.8">'+esc(c.notes.replace('True-negative pattern. ',''))+'</span>':'');
      cell.addEventListener('mousemove',(e)=>showTip(tipHtml,e.clientX,e.clientY));
      cell.addEventListener('mouseleave',hideTip);
      cell.addEventListener('focus',(e)=>{const r=cell.getBoundingClientRect();showTip(tipHtml,r.right,r.top);});
      cell.addEventListener('blur',hideTip);
      cells.appendChild(cell);
    });
    const summary = [];
    if (hit) summary.push(hit+' found');
    if (miss) summary.push(miss+' missed');
    if (fp) summary.push(fp+' false alarms');
    map.appendChild(el('div',{class:'gcols'},[
      el('div',{html:'<div style="font-weight:600"><span class="swatch" style="background:'+APPROACH_COLOR[appr]+'"></span>'+esc(appr)+'</div><div class="muted" style="margin-top:2px">'+summary.join(' · ')+'</div>'}),
      cells
    ]));
  });
  wrap.appendChild(map);
  // legend
  wrap.appendChild(el('div',{class:'legend',style:'margin-top:14px'},[
    el('span',{class:'it',html:'<span class="gcell vuln-hit" style="margin-right:7px"></span>Real flaw, detected'}),
    el('span',{class:'it',html:'<span class="gcell vuln-miss" style="margin-right:7px"></span>Real flaw, missed'}),
    el('span',{class:'it',html:'<span class="gcell tn-fp" style="margin-right:7px"></span>Safe, but false alarm'}),
    el('span',{class:'it',html:'<span class="gcell tn-ok" style="margin-right:7px"></span>Safe, correctly allowed'}),
  ]));
  return wrap;
}

/* ====================================================================== */
/* EXPLORE FINDINGS                                                        */
/* ====================================================================== */
const FIND = { cat:'all', sev:'all', q:'', open:new Set() };
function renderFindings(root){
  root.innerHTML='';
  const S = el('div',{class:'stack'});
  S.appendChild(el('h2',{text:'Explore the role-aware tool’s findings'}));
  S.appendChild(el('p',{class:'sub',html:'Every one of the '+DATA.findings.length+' findings the role-aware scanner wrote on the vulnerable build. Filter, search, and open any row to see the exact request and response that justified it. (Credentials are already redacted in the archived data.)'}));

  const cats = ['all', ...[...new Set(DATA.findings.map(f=>f.category))]];
  const sevs = ['all', ...[...new Set(DATA.findings.map(f=>f.severity))]];
  const catSel = el('select',{onchange:(e)=>{FIND.cat=e.target.value; drawRows();}}, cats.map(c=>el('option',{value:c, selected:c===FIND.cat?'':null},c==='all'?'All categories':c)));
  const sevSel = el('select',{onchange:(e)=>{FIND.sev=e.target.value; drawRows();}}, sevs.map(c=>el('option',{value:c, selected:c===FIND.sev?'':null},c==='all'?'All severities':c)));
  const search = el('input',{type:'search',placeholder:'Search path, account, text…',value:FIND.q,oninput:(e)=>{FIND.q=e.target.value.toLowerCase(); drawRows();}});
  S.appendChild(el('div',{class:'controls card flat'},[
    el('label',{},['Category',catSel]),
    el('label',{},['Severity',sevSel]),
    el('label',{style:'flex:1;min-width:180px'},['Search',search]),
  ]));

  const count = el('div',{class:'muted'});
  S.appendChild(count);
  const tbl = el('table',{});
  tbl.innerHTML = '<thead><tr><th></th><th>Category</th><th>Endpoint</th><th>Severity</th><th>Attacker → victim</th><th>What happened</th></tr></thead>';
  const tbody = el('tbody');
  tbl.appendChild(tbody);
  S.appendChild(el('div',{class:'card',style:'overflow-x:auto'},[tbl]));
  root.appendChild(S);

  function drawRows(){
    tbody.innerHTML='';
    const list = DATA.findings.filter(f=>{
      if (FIND.cat!=='all' && f.category!==FIND.cat) return false;
      if (FIND.sev!=='all' && f.severity!==FIND.sev) return false;
      if (FIND.q){ const hay=(f.path+' '+f.category+' '+(f.attacker?.account||'')+' '+(f.victim?.account||'')+' '+f.observed+' '+(f.method)).toLowerCase(); if(!hay.includes(FIND.q)) return false; }
      return true;
    });
    count.textContent = list.length+' of '+DATA.findings.length+' findings';
    if (!list.length){ tbody.appendChild(el('tr',{},[el('td',{colspan:'6',class:'muted',text:'No findings match these filters.'})])); return; }
    list.forEach(f=>{
      const isOpen = FIND.open.has(f.id);
      const tr = el('tr',{class:'expander', onclick:()=>{ if(FIND.open.has(f.id))FIND.open.delete(f.id); else FIND.open.add(f.id); drawRows(); }},[
        el('td',{style:'color:var(--text-muted)',text: isOpen?'▾':'▸'}),
        el('td',{},[CAT(f.category)]),
        el('td',{html:'<span class="m m-'+f.method+'">'+f.method+'</span> <span class="mono">'+esc(f.path)+'</span>'}),
        el('td',{html:'<span class="sev-badge '+f.severity+'">'+esc(f.severity)+'</span>'}),
        el('td',{html: f.attacker? esc(f.attacker.account)+' <span class="muted">('+esc(f.attacker.role)+')</span>'+(f.victim?' → '+esc(f.victim.account):'') : '–'}),
        el('td',{class:'muted',text:f.observed})
      ]);
      tbody.appendChild(tr);
      if (isOpen){
        const detail = el('tr',{class:'row-detail'},[el('td',{colspan:'6'},[ findingDetail(f) ])]);
        tbody.appendChild(detail);
      }
    });
  }
  drawRows();
}
function findingDetail(f){
  const d = el('div',{class:'stack'});
  d.appendChild(el('div',{class:'kv',html:
    '<dt>id</dt><dd class="mono">'+esc(f.id)+'</dd>'+
    '<dt>status</dt><dd>'+esc(f.status)+(f.confidence!=null?' · '+Math.round(f.confidence*100)+'% confidence':'')+'</dd>'+
    (f.resource?'<dt>object</dt><dd class="mono">'+esc(JSON.stringify(f.resource))+'</dd>':'')+
    '<dt>expected</dt><dd>'+esc(f.expected)+'</dd>'+
    '<dt>observed</dt><dd>'+esc(f.observed)+'</dd>'}));
  if (f.request && f.response){
    d.appendChild(el('div',{class:'exchange'},[
      el('div',{},[el('h4',{text:'Evidence — request'}), el('pre',{html:reqPre(f.request)})]),
      el('div',{},[el('h4',{text:'Evidence — response'}), el('pre',{html:resPre(f.response)})])
    ]));
  }
  return d;
}

/* ====================================================================== */
/* ROUTER + CHROME                                                         */
/* ====================================================================== */
const VIEWS = { overview:renderOverview, how:renderHow, results:renderResults, findings:renderFindings };
let CURRENT = 'overview';
function show(view){
  if (!VIEWS[view]) view='overview';
  CURRENT = view;
  $$('nav.tabs button').forEach(b=> b.setAttribute('aria-selected', String(b.dataset.view===view)));
  $$('section.view').forEach(s=> s.hidden = ('view-'+view)!==s.id);
  VIEWS[view]($('#view-'+view));
  if (location.hash.slice(1)!==view) history.replaceState(null,'','#'+view);
  window.scrollTo({top:0,behavior:'instant'});
}
$$('nav.tabs button').forEach(b=> b.addEventListener('click',()=>show(b.dataset.view)));
document.addEventListener('click',(e)=>{ const g=e.target.closest('[data-goto]'); if(g){ e.preventDefault(); show(g.dataset.goto); } });

// theme
const THEME_KEY='bac-webapp-theme';
function applyTheme(t){
  if (t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t==='dark' || (t!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme-ico').textContent = dark?'☾':'☀';
}
let theme='auto';
try { theme = localStorage.getItem(THEME_KEY)||'auto'; } catch {}
applyTheme(theme);
$('#theme-toggle').addEventListener('click',()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const now = matchMedia('(prefers-color-scheme: dark)').matches;
  theme = cur==='dark' ? 'light' : cur==='light' ? 'dark' : (now?'light':'dark');
  try { localStorage.setItem(THEME_KEY,theme); } catch {}
  applyTheme(theme);
  VIEWS[CURRENT]($('#view-'+CURRENT)); // re-render so SVG picks up CSS vars
});

// footer
$('#foot').innerHTML = 'Static viewer · generated '+esc(DATA.generated)+' from archived results at commit <span class="mono">'+esc(DATA.commit)+'</span>. '+
  'Every figure is read from the committed experiment data — this page does not run a live scan. '+
  'Thesis: <em>Automated Detection of Broken Access Control Vulnerabilities in REST APIs: A Role-Aware Testing Tool in JavaScript</em>.';

window.addEventListener('hashchange',()=> show(location.hash.slice(1)||'overview'));
show(location.hash.slice(1)||'overview');
</script>
