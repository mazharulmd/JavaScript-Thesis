<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" width="820" height="680" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Architecture of the role-aware testing tool and the evaluation pipeline">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box { fill: #fcfcfb; stroke: #898781; stroke-width: 1.2; }
      .in { fill: #f3f2ee; stroke: #898781; stroke-width: 1.2; }
      .ra { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 1.6; }
      .so { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.6; }
      .t { font-size: 14px; font-weight: 600; fill: #0b0b0b; }
      .s { font-size: 12px; fill: #52514e; }
      .n { font-size: 12px; font-weight: 700; fill: #52514e; }
      .ln { stroke: #52514e; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .grp { fill: none; stroke: #c3c2b7; stroke-width: 1; stroke-dasharray: 5 4; }
      .gl { font-size: 11.5px; fill: #898781; letter-spacing: 0.04em; }
    </style>
  </defs>
  <rect width="820" height="680" fill="#ffffff"/>

  <!-- inputs -->
  <rect class="in" x="40" y="20" width="350" height="62" rx="8"/>
  <text class="t" x="56" y="45">OpenAPI 3 specification</text>
  <text class="s" x="56" y="66">operations, schemas, x-access-control policy</text>
  <rect class="in" x="430" y="20" width="350" height="62" rx="8"/>
  <text class="t" x="446" y="45">Configuration (YAML)</text>
  <text class="s" x="446" y="66">accounts, roles, ownership fields, access rules, allowlist</text>

  <!-- tool group -->
  <rect class="grp" x="20" y="100" width="780" height="440" rx="12"/>
  <text class="gl" x="34" y="118">ROLE-AWARE TESTING TOOL (cli-tool/src)</text>

  <path class="ln" d="M380,82 V140"/>
  <path class="ln" d="M605,82 V140"/>

  <rect class="box" x="120" y="140" width="580" height="44" rx="8"/>
  <text class="n" x="136" y="167">1</text><text class="t" x="154" y="167">Parser and policy resolution</text>
  <text class="s" x="384" y="167">operation inventory; config rules override the spec</text>

  <path class="ln" d="M410,184 V204"/>
  <rect class="box" x="120" y="204" width="580" height="44" rx="8"/>
  <text class="n" x="136" y="231">2</text><text class="t" x="154" y="231">Multi-account login</text>
  <text class="s" x="384" y="231">one session and identity per account and role</text>

  <path class="ln" d="M410,248 V268"/>
  <rect class="box" x="120" y="268" width="580" height="44" rx="8"/>
  <text class="n" x="136" y="295">3</text><text class="t" x="154" y="295">Object discovery</text>
  <text class="s" x="384" y="295">which object belongs to which account</text>

  <path class="ln" d="M410,312 V332"/>
  <rect class="box" x="120" y="332" width="580" height="54" rx="8"/>
  <text class="n" x="136" y="356">4</text><text class="t" x="154" y="356">Shared test generator (one plan for both oracles)</text>
  <text class="s" x="154" y="375">BOLA: cross-user · BFLA: cross-role · auth/JWT: five token and header probes</text>

  <path class="ln" d="M410,386 V406"/>
  <rect class="box" x="120" y="406" width="580" height="44" rx="8"/>
  <text class="n" x="136" y="433">5</text><text class="t" x="154" y="433">Execution against the target API</text>
  <text class="s" x="420" y="433">timeouts, throttling, request counter</text>

  <path class="ln" d="M300,450 V470"/>
  <path class="ln" d="M520,450 V470"/>
  <rect class="ra" x="60" y="470" width="340" height="40" rx="8"/>
  <text class="t" x="76" y="495">6a Ownership-differential oracle</text>
  <rect class="so" x="420" y="470" width="340" height="40" rx="8"/>
  <text class="t" x="436" y="495">6b Status-only oracle (baseline)</text>

  <!-- outputs -->
  <path class="ln" d="M230,510 V572"/>
  <path class="ln" d="M590,510 V572"/>
  <rect class="box" x="60" y="572" width="700" height="44" rx="8"/>
  <text class="t" x="76" y="599">findings.json</text>
  <text class="s" x="190" y="599">common findings format, also produced from OWASP ZAP output by an adapter</text>

  <path class="ln" d="M230,616 V634"/>
  <path class="ln" d="M590,616 V634"/>
  <rect class="in" x="60" y="634" width="340" height="38" rx="8"/>
  <text class="t" x="76" y="658">Reports (JSON, HTML) and CI gate</text>
  <rect class="in" x="420" y="634" width="340" height="38" rx="8"/>
  <text class="t" x="436" y="658">compare.js + ground truth → metrics</text>
</svg>
