openapi: 3.0.3
info:
  title: BAC Benchmark API
  version: 1.0.0
  description: |
    Intentionally vulnerable REST API used as the controlled benchmark of the thesis
    "Automated Detection of Broken Access Control Vulnerabilities in REST APIs".

    This specification documents the **intended** (expected) access-control policy of every
    operation. The implementation deliberately deviates from it on a known set of operations
    (see `ground-truth.json`). The intended policy is expressed with the vendor extension
    `x-access-control`:

    | field        | meaning                                                                  |
    |--------------|--------------------------------------------------------------------------|
    | `roles`      | roles that may invoke the function (function-level authorization)       |
    | `ownership`  | `owner` = only the owner of the addressed object (admins bypass); `none` |
    | `ownerField` | dot-path of the ownership identifier inside the object representation  |
    | `resource`   | logical resource type                                                    |

    Roles: `admin` (full access), `user` (regular customer), `guest` (authenticated, read-only).

    **Run only in an isolated local environment. All credentials are synthetic.**
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local Docker / Node benchmark instance
tags:
  - name: auth
  - name: users
  - name: orders
  - name: documents
  - name: devices
  - name: products
  - name: admin
  - name: system
  - name: messaging
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      x-access-control: { roles: [anonymous], ownership: none }
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  flawsMode: { type: string, example: vulnerable }

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Obtain a JWT access token
      security: []
      x-access-control: { roles: [anonymous], ownership: none }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Profile of the authenticated caller
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: The caller's account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: Read a user account
      description: Users may read only their own account; administrators may read any account.
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: id, resource: user }
      responses:
        '200':
          description: The user account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user account
      description: Users may update only their own account; administrators may update any account.
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: id, resource: user }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/profiles/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getProfile
      summary: Read the extended profile of a user
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: userId, resource: profile }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/accounts/{accountId}/summary:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Account identifier (legacy parameter; the summary is always computed for the caller).
        schema: { type: integer, example: 2 }
    get:
      tags: [users]
      operationId: getAccountSummary
      summary: Billing summary of the caller's account
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: accountId, resource: account }
      responses:
        '200':
          description: Summary of the authenticated caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List the caller's orders (administrators see all orders)
      x-access-control: { roles: [admin, user, guest], ownership: none, resource: order }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place an order (not allowed for read-only guests)
      x-access-control: { roles: [admin, user], ownership: none, resource: order }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Read an order
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: order }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [orders]
      operationId: updateOrder
      summary: Update the shipping details of an order
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: order }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdate' }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [orders]
      operationId: deleteOrder
      summary: Cancel (delete) an order
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: order }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invoices:
    get:
      tags: [orders]
      operationId: listInvoices
      summary: List the caller's invoices
      x-access-control: { roles: [admin, user, guest], ownership: none, resource: invoice }
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema: { type: integer, example: 7001 }
    get:
      tags: [orders]
      operationId: getInvoice
      summary: Read an invoice (nested representation)
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: data.invoice.billing.accountId, resource: invoice }
      responses:
        '200':
          description: Invoice wrapped in a data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invoice: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List own documents and all public documents
      x-access-control: { roles: [admin, user, guest], ownership: none, resource: document }
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [documents]
      operationId: createDocument
      summary: Create a document (not allowed for read-only guests)
      x-access-control: { roles: [admin, user], ownership: none, resource: document }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCreate' }
      responses:
        '201':
          description: Created document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, example: doc-2-private }
    get:
      tags: [documents]
      operationId: getDocument
      summary: Read a document
      description: Private documents are visible to their owner and administrators; public documents (visibility = public) are readable by every authenticated user.
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: document, publicWhen: { field: visibility, equals: public } }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Edit a document
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: document }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdate' }
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document
      description: Returns 200 with `success = false` when the caller is not allowed to delete the document.
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: document }
      responses:
        '200':
          description: Result of the deletion attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List the caller's IoT devices
      x-access-control: { roles: [admin, user, guest], ownership: none, resource: device }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register an IoT device (not allowed for read-only guests)
      x-access-control: { roles: [admin, user], ownership: none, resource: device }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Registered device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      operationId: getDevice
      summary: Read a device
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: device }
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Deregister a device
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: device }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/devices/{deviceId}/readings:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [devices]
      operationId: getDeviceReadings
      summary: Read the sensor readings of a device
      x-access-control: { roles: [admin, user, guest], ownership: owner, resource: device }
      responses:
        '200':
          description: Sensor readings (the representation carries no owner identifier)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [devices]
      operationId: addDeviceReading
      summary: Ingest a sensor reading for a device
      x-access-control: { roles: [admin, user, guest], ownership: owner, resource: device }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingCreate' }
      responses:
        '201':
          description: Stored reading
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/devices/{deviceId}/config:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    put:
      tags: [devices]
      operationId: updateDeviceConfig
      summary: Change the device configuration (processed asynchronously)
      description: Every syntactically valid request is accepted with 202; the change is applied only if the caller owns the device.
      x-access-control: { roles: [admin, user, guest], ownership: owner, ownerField: ownerId, resource: device, verifyWith: 'GET /api/devices/{deviceId}' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceConfig' }
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: queued }
                  requestId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Public product catalogue
      security: []
      x-access-control: { roles: [anonymous], ownership: none, resource: product }
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [products]
      operationId: createProduct
      summary: Add a product to the catalogue (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: product }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: integer, example: 501 }
    get:
      tags: [products]
      operationId: getProduct
      summary: Public product details
      security: []
      x-access-control: { roles: [anonymous], ownership: none, resource: product }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [products]
      operationId: updateProduct
      summary: Replace a product (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: product }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Remove a product (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: product }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: List all user accounts (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: user }
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminCreateUser
      summary: Create a user account (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: user }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreate' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Username already exists }

  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [admin]
      operationId: adminDeleteUser
      summary: Delete a user account (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: user, verifyWith: 'GET /api/admin/users' }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [admin]
      operationId: adminChangeRole
      summary: Change the role of a user (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, user, guest], example: guest }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/stats:
    get:
      tags: [admin]
      operationId: adminStats
      summary: Platform statistics (administrators only)
      x-access-control: { roles: [admin], ownership: none }
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  orders: { type: integer }
                  documents: { type: integer }
                  devices: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/reports:
    get:
      tags: [admin]
      operationId: adminReports
      summary: Global sales reports (administrators only)
      description: Non-administrators receive an empty, self-scoped result (`scope = self`).
      x-access-control: { roles: [admin], ownership: none }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [global, self] }
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        ownerId: { type: integer }
                        revenue: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/audit-logs:
    get:
      tags: [admin]
      operationId: adminAuditLogs
      summary: Audit log (administrators only)
      description: Non-administrators receive 200 with `success = false`.
      x-access-control: { roles: [admin], ownership: none }
      responses:
        '200':
          description: Audit log or refusal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        actor: { type: integer }
                        action: { type: string }
                        target: { type: integer }
                        at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/announcements:
    post:
      tags: [admin]
      operationId: adminCreateAnnouncement
      summary: Publish an announcement (administrators only)
      x-access-control: { roles: [admin], ownership: none, resource: announcement }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, message]
              properties:
                title: { type: string, example: Maintenance window }
                message: { type: string, example: The platform will be offline on Sunday. }
      responses:
        '201':
          description: Created announcement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/backups:
    post:
      tags: [admin]
      operationId: adminStartBackup
      summary: Start a database backup (administrators only)
      x-access-control: { roles: [admin], ownership: none }
      responses:
        '202':
          description: Backup started
          content:
            application/json:
              schema:
                type: object
                properties:
                  backupId: { type: string }
                  status: { type: string }
                  requestedBy: { type: integer }
                  jobId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/announcements:
    get:
      tags: [messaging]
      operationId: listAnnouncements
      summary: Read announcements
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcements:
                    type: array
                    items: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/system/diagnostics:
    get:
      tags: [system]
      operationId: getDiagnostics
      summary: Internal diagnostics (authenticated users)
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/support/tickets:
    post:
      tags: [system]
      operationId: createSupportTicket
      summary: Open a support ticket (authenticated users)
      x-access-control: { roles: [admin, user, guest], ownership: none }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, example: Cannot pair device }
                message: { type: string, example: The pairing dialog does not appear. }
      responses:
        '201':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  subject: { type: string }
                  message: { type: string }
                  createdBy: { type: integer, nullable: true }
                  status: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/analytics/summary:
    get:
      tags: [system]
      operationId: getAnalyticsSummary
      summary: Business analytics summary (authenticated users)
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  orders: { type: integer }
                  revenue: { type: number }
                  activeDevices: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/messages:
    get:
      tags: [messaging]
      operationId: listMessages
      summary: The caller's private messages
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        recipientId: { type: integer }
                        from: { type: string }
                        subject: { type: string }
                        body: { type: string }
                        sentAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications:
    get:
      tags: [messaging]
      operationId: listNotifications
      summary: The caller's notifications
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        userId: { type: integer }
                        text: { type: string }
                        read: { type: boolean }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/sessions:
    get:
      tags: [messaging]
      operationId: listSessions
      summary: The caller's active sessions
      x-access-control: { roles: [admin, user, guest], ownership: none }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        userId: { type: integer }
                        device: { type: string }
                        ip: { type: string }
                        lastSeen: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256-signed JWT obtained from POST /api/auth/login.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, example: 2 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, example: 1003 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, example: dev-002-a }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (or hidden from the caller)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    OperationResult:
      type: object
      properties:
        success: { type: boolean }
        deleted: { type: string }
        error: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, format: password, example: Alice#2026 }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
        user:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            role: { type: string, enum: [admin, user, guest] }
    User:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { type: string, enum: [admin, user, guest] }
        createdAt: { type: string, format: date-time, readOnly: true }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, example: Alice E. }
        phone: { type: string, example: '+358-40-000-0099' }
    AdminUserCreate:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: temp-user }
        email: { type: string, format: email, example: temp-user@bench.local }
        password: { type: string, format: password, example: Temp#2026 }
        role: { type: string, enum: [admin, user, guest], example: user }
    Profile:
      type: object
      properties:
        userId: { type: integer }
        displayName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        bio: { type: string }
    AccountSummary:
      type: object
      properties:
        accountId: { type: integer }
        username: { type: string }
        orderCount: { type: integer }
        totalSpent: { type: number }
        currency: { type: string }
    Order:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        ownerId: { type: integer, readOnly: true }
        status: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number }
        total: { type: number }
        shippingAddress: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
    OrderCreate:
      type: object
      required: [sku, quantity, shippingAddress]
      properties:
        sku: { type: string, example: SKU-501 }
        quantity: { type: integer, minimum: 1, maximum: 100, example: 1 }
        shippingAddress: { type: string, example: 1 Test Street, 70100 Kuopio }
        note: { type: string, example: Leave at the door }
    OrderUpdate:
      type: object
      required: [shippingAddress]
      properties:
        shippingAddress: { type: string, example: 2 Test Street, 70100 Kuopio }
        note: { type: string, example: Ring twice }
    Invoice:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        billing:
          type: object
          properties:
            accountId: { type: integer }
            iban: { type: string }
            address: { type: string }
        issuedAt: { type: string, format: date-time }
    Document:
      type: object
      properties:
        id: { type: string, readOnly: true }
        ownerId: { type: integer, readOnly: true }
        title: { type: string }
        content: { type: string }
        visibility: { type: string, enum: [private, public] }
        createdAt: { type: string, format: date-time, readOnly: true }
    DocumentCreate:
      type: object
      required: [title, content]
      properties:
        title: { type: string, example: Meeting notes }
        content: { type: string, example: Notes from the weekly meeting. }
        visibility: { type: string, enum: [private, public], example: private }
    DocumentUpdate:
      type: object
      properties:
        title: { type: string, example: Updated title }
        content: { type: string, example: Updated content. }
        visibility: { type: string, enum: [private, public] }
    Device:
      type: object
      properties:
        deviceId: { type: string, readOnly: true }
        ownerId: { type: integer, readOnly: true }
        name: { type: string }
        type: { type: string, enum: [temperature-sensor, humidity-sensor, smart-plug] }
        firmware: { type: string }
        location: { type: string }
        config: { $ref: '#/components/schemas/DeviceConfig' }
        registeredAt: { type: string, format: date-time, readOnly: true }
    DeviceCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, example: Kitchen sensor }
        type: { type: string, enum: [temperature-sensor, humidity-sensor, smart-plug], example: temperature-sensor }
        location: { type: string, example: Kitchen }
    DeviceConfig:
      type: object
      required: [samplingIntervalSec, label]
      properties:
        samplingIntervalSec: { type: integer, minimum: 1, maximum: 86400, example: 30 }
        label: { type: string, example: living-room }
    Reading:
      type: object
      properties:
        deviceId: { type: string }
        ts: { type: string, format: date-time }
        value: { type: number }
        unit: { type: string, enum: ['C', 'F', '%'] }
        note: { type: string }
    ReadingCreate:
      type: object
      required: [value]
      properties:
        value: { type: number, minimum: -100, maximum: 200, example: 21.5 }
        unit: { type: string, enum: ['C', 'F', '%'], example: 'C' }
        note: { type: string, example: manual reading }
    ReadingList:
      type: object
      properties:
        deviceId: { type: string }
        unit: { type: string }
        readings:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              value: { type: number }
              unit: { type: string }
              note: { type: string }
    Product:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        sku: { type: string }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
    ProductInput:
      type: object
      required: [sku, name, price]
      properties:
        sku: { type: string, example: SKU-900 }
        name: { type: string, example: Test product }
        price: { type: number, minimum: 0, example: 9.99 }
        stock: { type: integer, minimum: 0, example: 5 }
    Announcement:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
